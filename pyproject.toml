[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trading-system"
version = "0.1.0"
description = "Intelligence Trading Platform core (MT5, Crucix, risk, backtest, paper/demo execution)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyarrow>=16",
    "httpx>=0.27",
    "tzdata>=2024.1",  # IANA zones on Windows (pyarrow UTC, New York rollover)
]

[project.optional-dependencies]
# Windows only: the package needs the MT5 terminal installed on the same machine.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
trading-system = "trading_system.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ without installing it (CI does not build the project).
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -m 'not mt5'"
markers = [
    "mt5: integration tests that need a running MT5 demo terminal (excluded by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["trading_system"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "MetaTrader5"]
ignore_missing_imports = true
