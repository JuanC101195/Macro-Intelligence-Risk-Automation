name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Exact versions and hashes from uv.lock, prebuilt wheels only (--no-build: no
      # package is built from source, so no setup scripts run). The project itself is
      # not installed: tests and mypy import it from src/.
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --no-install-project --no-build
      - name: Ruff
        run: uv run --no-sync --no-build ruff check .
      - name: Mypy
        run: uv run --no-sync --no-build mypy
      - name: Tests
        run: uv run --no-sync --no-build pytest

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
